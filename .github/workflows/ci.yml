name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: nuget-

    - run: dotnet restore SqlSchemaHasher.sln --locked-mode
    - run: dotnet build SqlSchemaHasher.sln -c Release --no-restore
    - run: dotnet test SqlSchemaHasher.sln -c Release --no-build --verbosity normal
    - run: dotnet pack src/zachtbeer.SqlSchemaHasher.csproj -c Release --no-build -o ./artifacts

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlserver: ['2019-latest', '2022-latest']
    env:
      SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sqlserver }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: nuget-

    - run: dotnet restore SqlSchemaHasher.sln --locked-mode
    - run: dotnet build SqlSchemaHasher.sln -c Release --no-restore
    - run: dotnet test SqlSchemaHasher.sln -c Release --no-build --verbosity normal

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - run: dotnet restore SqlSchemaHasher.sln --locked-mode

    - name: Check for vulnerable packages
      run: |
        dotnet list SqlSchemaHasher.sln package --vulnerable --include-transitive | tee vulnerable.txt
        if grep -q "has the following vulnerable packages" vulnerable.txt; then
          echo "Vulnerable packages found."
          exit 1
        fi
