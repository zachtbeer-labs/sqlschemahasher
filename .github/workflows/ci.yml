name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: nuget-

    - run: dotnet restore SqlSchemaHasher.slnx --locked-mode
    - run: dotnet build SqlSchemaHasher.slnx -c Release --no-restore
    - run: dotnet test tests/SqlSchemaHash.UnitTests/SqlSchemaHash.UnitTests.csproj -c Release --no-build --verbosity normal

    # Executes each no-database benchmark exactly once with no statistics, so a benchmark that
    # throws is caught at PR time. This is a compile-and-run check, NOT a performance gate: it must
    # never fail on a slow result. The integration tier is excluded — it needs a SQL Server.
    # --artifacts redirects output away from the committed benchmarks/results/<version> baseline
    # (BenchmarkConfig.Create pins that path by default): CLI arguments override config, and without
    # this a maintainer copy-pasting this command locally to reproduce a CI failure would silently
    # overwrite the published baseline with single-iteration Dry-job results.
    - name: Benchmark smoke run
      run: dotnet run --project benchmarks/SqlSchemaHasher.Benchmarks -c Release --no-build -- --job Dry --filter '*CalculatorBenchmarks*' '*ObjectKindBenchmarks*' --artifacts /tmp/benchmark-smoke-artifacts

    - run: dotnet pack src/zachtbeer.SqlSchemaHasher.csproj -c Release --no-build -o ./artifacts

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlserver: ['2019-latest', '2022-latest']
    env:
      SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sqlserver }}
    steps:
    # fetch-depth: 0 for MinVer — it needs full history and tags to compute the version.
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: nuget-

    - run: dotnet restore SqlSchemaHasher.slnx --locked-mode
    - run: dotnet build SqlSchemaHasher.slnx -c Release --no-restore
    - run: dotnet test SqlSchemaHasher.slnx -c Release --no-build --verbosity normal

  security-scan:
    runs-on: ubuntu-latest
    steps:
    # fetch-depth: 0 for MinVer — it needs full history and tags to compute the version.
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - run: dotnet restore SqlSchemaHasher.slnx --locked-mode

    - name: Check for vulnerable packages
      run: |
        dotnet list SqlSchemaHasher.slnx package --vulnerable --include-transitive | tee vulnerable.txt
        if grep -q "has the following vulnerable packages" vulnerable.txt; then
          echo "Vulnerable packages found."
          exit 1
        fi
