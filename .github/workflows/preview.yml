name: Preview
# No inputs: MinVer versions an untagged commit as a height-based prerelease off the last tag
# (e.g. 2.0.1-alpha.0.7), which is already unique per commit.
on:
  workflow_dispatch:

concurrency:
  group: preview-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Job-level so it reaches the build, where MinVer stamps the assembly (pack runs --no-build).
    # nuget.org ignores build metadata, so this is assembly-level traceability only.
    env:
      MinVerBuildMetadata: ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      - run: dotnet restore SqlSchemaHasher.slnx --locked-mode
      - run: dotnet build SqlSchemaHasher.slnx -c Release --no-restore
      - run: dotnet test SqlSchemaHasher.slnx -c Release --no-build --verbosity normal

      - name: Pack
        id: pack
        run: |
          dotnet pack src/zachtbeer.SqlSchemaHasher.csproj -c Release --no-build -o ./preview-packages
          package=$(basename ./preview-packages/*.nupkg .nupkg)
          echo "version=${package#zachtbeer.SqlSchemaHasher.}" >> "$GITHUB_OUTPUT"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-packages
          path: |
            ./preview-packages/*.nupkg
            ./preview-packages/*.snupkg

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./preview-packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Summary
        run: |
          {
            echo "## Preview package published"
            echo ""
            echo '```bash'
            echo "dotnet add package zachtbeer.SqlSchemaHasher --version ${{ steps.pack.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
