name: Preview
on:
  workflow_dispatch:
    inputs:
      base_version:
        description: 'Base version for the preview (e.g. 1.1.0)'
        required: true
      preview_label:
        description: 'Prerelease label'
        required: false
        default: 'preview'

concurrency:
  group: preview-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      - name: Compute preview version
        id: version
        run: echo "version=${{ inputs.base_version }}-${{ inputs.preview_label }}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: dotnet restore SqlSchemaHasher.sln --locked-mode
      - run: dotnet build SqlSchemaHasher.sln -c Release --no-restore
      - run: dotnet test SqlSchemaHasher.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/zachtbeer.SqlSchemaHasher.csproj -c Release --no-build -o ./preview-packages /p:Version=${{ steps.version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-packages
          path: |
            ./preview-packages/*.nupkg
            ./preview-packages/*.snupkg

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./preview-packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Summary
        run: |
          {
            echo "## Preview package published"
            echo ""
            echo '```bash'
            echo "dotnet add package zachtbeer.SqlSchemaHasher --version ${{ steps.version.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
