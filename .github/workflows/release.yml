name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      - run: dotnet restore SqlSchemaHasher.sln --locked-mode
      - run: dotnet build SqlSchemaHasher.sln -c Release --no-restore
      - run: dotnet test SqlSchemaHasher.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/zachtbeer.SqlSchemaHasher.csproj -c Release --no-build -o ./artifacts /p:Version=${{ inputs.version }}

      # Attest before pushing: nuget.org adds a repository signature that changes
      # the package bytes, which would invalidate an attestation made afterwards.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: ./artifacts/*.nupkg

      - name: Copy attestation bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" ./artifacts/provenance.intoto.jsonl

      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX src/zachtbeer.SqlSchemaHasher.csproj --output ./artifacts --filename bom.json --json

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/provenance.intoto.jsonl
            ./artifacts/bom.json

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            ./artifacts/*.nupkg \
            ./artifacts/*.snupkg \
            ./artifacts/provenance.intoto.jsonl \
            ./artifacts/bom.json \
            -t "v${{ inputs.version }}" \
            --generate-notes
