name: Release
# Pushing the tag is the release. MinVer derives every version number in the build from it,
# so there is no version input to keep in sync.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      # Fails fast, before the ~minutes-long build, on the classic mistake of tagging a
      # release whose CHANGELOG entry was never written or never dated. Prerelease tags are
      # exempt — the changelog tracks releases, not the previews leading up to one.
      - name: Verify CHANGELOG entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            echo "Prerelease ${version}: skipping CHANGELOG check."
            exit 0
          fi
          heading=$(grep -m1 "^## \[${version}\]" CHANGELOG.md) || {
            echo "CHANGELOG.md has no '## [${version}]' heading."
            exit 1
          }
          if grep -qi 'unreleased' <<< "$heading"; then
            echo "CHANGELOG.md still marks ${version} as unreleased: ${heading}"
            exit 1
          fi

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      - run: dotnet restore SqlSchemaHasher.slnx --locked-mode
      - run: dotnet build SqlSchemaHasher.slnx -c Release --no-restore
      - run: dotnet test SqlSchemaHasher.slnx -c Release --no-build --verbosity normal

      # No version argument: MinVer stamped the tag's version at build time and --no-build keeps it.
      - name: Pack
        run: dotnet pack src/zachtbeer.SqlSchemaHasher.csproj -c Release --no-build -o ./artifacts

      # Attest before pushing: nuget.org adds a repository signature that changes
      # the package bytes, which would invalidate an attestation made afterwards.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: ./artifacts/*.nupkg

      - name: Copy attestation bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" ./artifacts/provenance.intoto.jsonl

      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX src/zachtbeer.SqlSchemaHasher.csproj --output ./artifacts --filename bom.json --json

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/provenance.intoto.jsonl
            ./artifacts/bom.json

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            ./artifacts/*.nupkg \
            ./artifacts/*.snupkg \
            ./artifacts/provenance.intoto.jsonl \
            ./artifacts/bom.json \
            -t "${{ github.ref_name }}" \
            --generate-notes
